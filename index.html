<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Pokémon Viewer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Random Pokémon Viewer</h1>
        <button id="fetch-pokemon">Get Random Pokémon</button>
        <div id="pokemon-info">
            <div id="pokemon-image">
                <!-- Pokémon sprite will be displayed here -->
            </div>
            <h2 id="pokemon-name">Name: </h2>
            <p id="pokemon-id">ID: </p>
            <p id="pokemon-types">Type(s): </p>
            <p id="pokemon-abilities">Abilities: </p>
            <div id="pokemon-stats">
                <h3>Stats:</h3>
                <ul id="stats-list">
                    
                </ul>
            </div>
        </div>        
    </div>
    <script src="script.js"></script>
</body>
</html>
